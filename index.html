<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner Pro</title>
    
    <!-- Fonts: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Icons: Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Library: HTML5-QRCode -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <!-- Tailwind CSS (Utility) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* --- テーマ設定 --- */
        :root {
            /* ライトモード */
            --bg-body: #f0f2f5;
            --bg-panel: #ffffff;
            --text-main: #212529;
            --text-sub: #6c757d;
            --primary: #007bff;
            --primary-hover: #0056b3;
            --border-color: #dee2e6;
            --scan-line: #007bff;
            --input-bg: #f8f9fa;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --sheet-overlay: rgba(0,0,0,0.4);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* ダークモード */
                --bg-body: #121212;
                --bg-panel: #1e1e1e;
                --text-main: #e9ecef;
                --text-sub: #adb5bd;
                --primary: #3d8bfd;
                --primary-hover: #1a6fd8;
                --border-color: #343a40;
                --scan-line: #3d8bfd;
                --input-bg: #2b3035;
                --shadow: 0 4px 20px rgba(0,0,0,0.4);
                --sheet-overlay: rgba(0,0,0,0.7);
            }
        }

        /* --- 基本スタイル --- */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden; /* 横スクロール防止 */
        }

        /* --- レイアウト --- */
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            height: 100vh;
            box-sizing: border-box;
        }

        @media (min-width: 768px) {
            .main-layout {
                flex-direction: row;
                align-items: flex-start;
                padding: 40px;
                overflow: hidden;
            }
            .scanner-section {
                flex: 1;
                width: 100%;
                height: calc(100vh - 80px);
            }
            .result-section {
                width: 400px;
                height: auto;
                max-height: calc(100vh - 80px);
            }
        }

        /* --- パネル --- */
        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            position: relative;
        }

        /* ヘッダー */
        .header-bar {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-panel);
            flex-shrink: 0;
        }

        .app-title {
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* タブ */
        .tabs {
            display: flex;
            padding: 8px 16px;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-panel);
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .tab-btn.active {
            background-color: var(--input-bg);
            color: var(--primary);
            font-weight: 700;
        }

        /* --- スキャナー画面 --- */
        .scanner-viewport {
            position: relative;
            background-color: #000;
            flex-grow: 1;
            min-height: 400px; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #reader {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* 不要な要素を非表示 */
        #reader > div { display: none !important; }
        #reader video { display: block !important; object-fit: cover !important; }

        /* スキャン枠（独自） */
        .scan-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 250px; height: 250px;
            pointer-events: none;
            display: none;
            z-index: 10;
        }
        .scan-overlay.active { display: block; }

        .scan-corner {
            position: absolute; width: 40px; height: 40px;
            border-color: var(--scan-line);
            border-style: solid; border-width: 4px;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
            border-radius: 4px; 
        }
        .top-left { top: 0; left: 0; border-right: none; border-bottom: none; border-top-left-radius: 20px; }
        .top-right { top: 0; right: 0; border-left: none; border-bottom: none; border-top-right-radius: 20px; }
        .bottom-left { bottom: 0; left: 0; border-right: none; border-top: none; border-bottom-left-radius: 20px; }
        .bottom-right { bottom: 0; right: 0; border-left: none; border-top: none; border-bottom-right-radius: 20px; }

        .scan-laser {
            position: absolute; width: 100%; height: 2px;
            background: var(--scan-line);
            top: 0; box-shadow: 0 0 10px var(--scan-line);
            animation: scan 2s infinite linear;
            opacity: 0.8;
        }
        @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }

        /* --- アップロード画面 & 説明文 --- */
        .file-upload-area {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: var(--input-bg);
            position: relative;
            padding: 20px;
            overflow-y: auto;
        }
        .file-upload-area.active { display: flex; }

        .upload-content {
            text-align: center;
            max-width: 400px;
            width: 100%;
            background: var(--bg-panel);
            padding: 30px;
            border-radius: 16px;
            border: 2px dashed var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .upload-icon {
            font-size: 3.5rem;
            color: var(--text-sub);
            margin-bottom: 15px;
            display: block;
        }

        .custom-file-upload {
            display: inline-block;
            padding: 12px 30px;
            cursor: pointer;
            background-color: var(--primary);
            color: white;
            border-radius: 50px;
            font-weight: 600;
            margin: 15px 0;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .custom-file-upload:hover { 
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        #qr-input-file { display: none; }

        /* 復活させた説明文 */
        .upload-hint {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-sub);
            text-align: left;
            background-color: var(--input-bg);
            padding: 15px;
            border-radius: 10px;
            line-height: 1.6;
        }
        .upload-hint strong {
            color: var(--text-main);
        }

        /* --- ローディングスピナー --- */
        .loader-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 50;
        }
        @media (prefers-color-scheme: dark) {
            .loader-overlay { background-color: rgba(30, 30, 30, 0.9); }
        }
        .loader-overlay.active { display: flex; }

        .loader {
            width: 60px; height: 60px;
            animation: rotate 1s linear infinite;
        }
        .loader .path {
            stroke: #007bff; stroke-linecap: round;
            stroke-dasharray: 89 150; stroke-dashoffset: 0;
            stroke-width: 1.5;
        }
        @media (prefers-color-scheme: dark) { .loader .path { stroke: #1a73e8; } }
        @keyframes rotate { 100% { transform: rotate(360deg); } }

        .loading-msg { margin-top: 15px; font-weight: 500; color: var(--text-sub); }

        /* --- 結果パネル (スマホ向けボトムシート & アニメーション) --- */
        
        /* バックドロップ（暗い背景） */
        .sheet-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--sheet-overlay);
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 90;
        }
        .sheet-backdrop.active { opacity: 1; pointer-events: auto; }

        .result-panel-content {
            padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
            height: 100%;
            overflow-y: auto;
        }

        /* スマホ: 下から出てくるボトムシートスタイル */
        @media (max-width: 767px) {
            .result-section {
                position: fixed;
                bottom: 0; left: 0;
                width: 100%;
                z-index: 100;
                border-radius: 24px 24px 0 0;
                box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
                
                /* 初期状態: 下に隠す */
                transform: translateY(100%);
                opacity: 0;
                transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
                
                max-height: 85vh;
                padding-bottom: 20px; /* iPhoneの下部バー対応 */
            }

            .result-section.active {
                transform: translateY(0);
                opacity: 1;
            }

            /* シートハンドル */
            .result-section::before {
                content: ''; display: block;
                width: 40px; height: 5px;
                background-color: var(--border-color);
                border-radius: 10px;
                margin: 12px auto 0;
            }
        }

        /* PC: 通常の右カラム、ただしアニメーションはつける */
        @media (min-width: 768px) {
            .sheet-backdrop { display: none; } /* PCでは暗くしない */
            
            .result-section {
                position: relative;
                transform: none; opacity: 1;
                background: var(--bg-panel);
            }
            
            /* 結果が出たときのみ中身をフェードイン */
            .result-content {
                opacity: 0;
                transform: translateY(10px);
                transition: all 0.4s ease-out;
            }
            .result-content.show {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 結果内容のスタイル */
        .empty-state {
            text-align: center; color: var(--text-sub);
            margin-top: 50px;
            display: flex; flex-direction: column; align-items: center;
        }
        .empty-state i { font-size: 3rem; margin-bottom: 10px; opacity: 0.3; }

        .result-content { display: none; flex-direction: column; gap: 15px; }
        .result-content.show { display: flex; }

        .scanned-label { font-size: 0.8rem; color: var(--text-sub); font-weight: 600; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }

        .scanned-value-box {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            font-family: monospace;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            color: var(--text-main);
            font-size: 1rem;
        }

        .action-btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }

        .btn {
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 1rem;
            transition: all 0.2s;
            width: 100%;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:active { transform: scale(0.98); }

        .btn-primary { background-color: var(--primary); color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .btn-secondary { background-color: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background-color: var(--border-color); }

        /* スマホ用の閉じるボタン */
        .close-sheet-btn {
            position: absolute; top: 15px; right: 15px;
            background: transparent; border: none;
            font-size: 1.5rem; color: var(--text-sub);
            cursor: pointer; z-index: 10;
        }
        @media (min-width: 768px) { .close-sheet-btn { display: none; } }

    </style>
</head>
<body>

    <!-- 背景バックドロップ (スマホ用) -->
    <div class="sheet-backdrop" id="sheet-backdrop" onclick="closeResultSheet()"></div>

    <div class="main-layout">
        
        <!-- 左側：スキャナーセクション -->
        <section class="scanner-section panel">
            <div class="header-bar">
                <div class="app-title">
                    <i class="bi bi-qr-code-scan" style="color: var(--primary);"></i>
                    <span>QR Scanner</span>
                </div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" id="tab-camera" onclick="switchMode('camera')">
                    <i class="bi bi-camera-fill"></i> カメラ
                </button>
                <button class="tab-btn" id="tab-file" onclick="switchMode('file')">
                    <i class="bi bi-image-fill"></i> 画像アップロード
                </button>
            </div>

            <div class="scanner-viewport">
                <!-- カメラ映像 -->
                <div id="reader"></div>
                
                <!-- カメラ用フレーム -->
                <div class="scan-overlay" id="scan-overlay">
                    <div class="scan-corner top-left"></div>
                    <div class="scan-corner top-right"></div>
                    <div class="scan-corner bottom-left"></div>
                    <div class="scan-corner bottom-right"></div>
                    <div class="scan-laser"></div>
                </div>

                <!-- ファイルアップロードUI (説明文復活版) -->
                <div class="file-upload-area" id="file-upload-area">
                    <div class="upload-content">
                        <i class="bi bi-cloud-arrow-up upload-icon"></i>
                        <h3 style="font-size: 1.2rem; margin-bottom: 5px; font-weight: 700;">画像をアップロード</h3>
                        
                        <label for="qr-input-file" class="custom-file-upload">
                            ファイルを選択
                        </label>
                        <input type="file" id="qr-input-file" accept="image/*">

                        <!-- 復活した説明文エリア -->
                        <div class="upload-hint">
                            <p style="margin-bottom: 8px;"><i class="bi bi-info-circle-fill"></i> <strong>スクリーンショット対応</strong></p>
                            <p style="font-size: 0.8rem;">
                                画像内のQRコードが小さすぎると読み取れない場合があります。<br>
                                読み取れない時は、<strong>画像をトリミング（切り抜き）</strong>して、QRコード部分を大きくしてから再度お試しください。
                            </p>
                        </div>
                    </div>
                </div>

                <!-- ローディングスピナー -->
                <div class="loader-overlay" id="loading-overlay">
                    <svg id="spinner" class="loader" viewBox="0 0 50 50">
                        <circle class="path" cx="25" cy="25" r="20" fill="none"></circle>
                    </svg>
                    <div class="loading-msg">解析中...</div>
                </div>
            </div>
        </section>

        <!-- 右側（スマホでは下から出てくる）：結果表示セクション -->
        <section class="result-section panel" id="result-section">
            <button class="close-sheet-btn" onclick="closeResultSheet()">
                <i class="bi bi-x-lg"></i>
            </button>

            <div class="header-bar" style="border-bottom: none; padding-bottom: 0;">
                <div class="app-title" style="font-size: 1rem;">
                    <i class="bi bi-card-text"></i> スキャン結果
                </div>
            </div>
            
            <div class="result-panel-content">
                <!-- 未スキャン時の表示 -->
                <div id="empty-state" class="empty-state">
                    <i class="bi bi-qr-code"></i>
                    <p>カメラでスキャンするか<br>画像をアップロードしてください</p>
                </div>

                <!-- 結果表示 -->
                <div id="result-content" class="result-content">
                    <div>
                        <span class="scanned-label">読み取り内容</span>
                        <div class="scanned-value-box" id="result-text"></div>
                    </div>
                    
                    <div class="action-btn-group">
                        <button class="btn btn-primary" id="open-link-btn" onclick="openLink()" disabled>
                            <i class="bi bi-box-arrow-up-right"></i> URLを開く
                        </button>
                        <button class="btn btn-secondary" onclick="copyToClipboard()">
                            <i class="bi bi-clipboard"></i> コピー
                        </button>
                        <button class="btn btn-secondary" onclick="resetScanner()">
                            <i class="bi bi-arrow-clockwise"></i> 次をスキャン
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <script>
        // --- 変数定義 ---
        const html5QrCode = new Html5Qrcode("reader");
        const fileInput = document.getElementById('qr-input-file');
        const resultSection = document.getElementById('result-section');
        const backdrop = document.getElementById('sheet-backdrop');
        const emptyState = document.getElementById('empty-state');
        const resultContent = document.getElementById('result-content');
        const resultText = document.getElementById('result-text');
        const scanOverlay = document.getElementById('scan-overlay');
        const loadingOverlay = document.getElementById('loading-overlay');
        const openLinkBtn = document.getElementById('open-link-btn');
        
        let currentMode = 'camera';
        let isScanning = false;

        // --- モード切替 ---
        function switchMode(mode) {
            currentMode = mode;
            
            // タブのUI更新
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${mode}`).classList.add('active');

            const readerDiv = document.getElementById('reader');
            const fileArea = document.getElementById('file-upload-area');

            if (mode === 'camera') {
                fileArea.classList.remove('active');
                readerDiv.style.display = 'block';
                startCamera();
            } else {
                stopCamera().then(() => {
                    readerDiv.style.display = 'none';
                    scanOverlay.classList.remove('active');
                    fileArea.classList.add('active');
                });
            }
        }

        // --- カメラ機能 ---
        function startCamera() {
            if (isScanning) return;

            const config = { 
                fps: 10, 
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            };
            
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
            .then(() => {
                isScanning = true;
                scanOverlay.classList.add('active');
            })
            .catch(err => {
                console.error("Camera Error", err);
                alert("カメラを起動できませんでした。");
            });
        }

        function stopCamera() {
            if (isScanning) {
                return html5QrCode.stop().then(() => {
                    isScanning = false;
                    scanOverlay.classList.remove('active');
                    const video = document.querySelector('#reader video');
                    if(video) video.remove();
                }).catch(err => console.error(err));
            }
            return Promise.resolve();
        }

        // --- 画像ファイル処理 ---
        const dropArea = document.getElementById('file-upload-area');
        dropArea.addEventListener('dragover', (e) => { e.preventDefault(); });
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', e => {
            if (e.target.files.length === 0) return;
            handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            loadingOverlay.classList.add('active');
            
            // レンダリング更新のため遅延
            setTimeout(() => {
                html5QrCode.scanFile(file, true)
                    .then(decodedText => {
                        loadingOverlay.classList.remove('active');
                        onScanSuccess(decodedText);
                    })
                    .catch(err => {
                        loadingOverlay.classList.remove('active');
                        console.error("Scan Error", err);
                        alert("読み取れませんでした。QRコード部分をトリミングして再度お試しください。");
                        fileInput.value = '';
                    });
            }, 100); 
        }

        // --- スキャン成功時 ---
        function onScanSuccess(decodedText, decodedResult) {
            if (currentMode === 'camera') {
                stopCamera();
            }

            // 表示更新
            emptyState.style.display = 'none';
            resultContent.classList.add('show');
            resultText.innerText = decodedText;

            // URL判定
            if (isValidURL(decodedText)) {
                openLinkBtn.disabled = false;
                openLinkBtn.innerHTML = '<i class="bi bi-box-arrow-up-right"></i> URLを開く';
            } else {
                openLinkBtn.disabled = true;
                openLinkBtn.innerHTML = '<i class="bi bi-text-left"></i> URLではありません';
            }

            // アニメーション発火 (スマホ: ボトムシート表示, PC: フェードイン)
            resultSection.classList.add('active');
            backdrop.classList.add('active');
        }

        function onScanFailure(error) {
            // console.log(error);
        }

        // --- アクション ---
        function copyToClipboard() {
            const text = resultText.innerText;
            if(!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.btn-secondary'); 
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="bi bi-check-lg"></i> コピーしました';
                setTimeout(() => { btn.innerHTML = originalHtml; }, 2000);
            });
        }

        function openLink() {
            const text = resultText.innerText;
            if (isValidURL(text)) {
                window.open(text, '_blank');
            }
        }

        function closeResultSheet() {
            resultSection.classList.remove('active');
            backdrop.classList.remove('active');
        }

        function resetScanner() {
            closeResultSheet();
            fileInput.value = '';
            
            // 少し待ってから中身をリセット
            setTimeout(() => {
                resultContent.classList.remove('show');
                emptyState.style.display = 'flex';
                if (currentMode === 'camera') {
                    startCamera();
                }
            }, 300);
        }

        function isValidURL(string) {
            try { new URL(string); return true; } catch (_) { return false; }
        }

        // 初期化
        window.onload = () => {
            switchMode('camera');
        };
    </script>
</body>
</html>
