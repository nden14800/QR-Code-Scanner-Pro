<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner Pro</title>
    
    <!-- Fonts: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Icons: Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Library: HTML5-QRCode -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <!-- Tailwind CSS (Utility for layout) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* --- CSS変数 & テーマ設定 --- */
        :root {
            /* ライトモード */
            --bg-body: #f8f9fa;
            --bg-panel: #ffffff;
            --text-main: #212529;
            --text-sub: #6c757d;
            --primary: #007bff;
            --primary-hover: #0056b3;
            --border-color: #dee2e6;
            --scan-line: #007bff;
            --input-bg: #f1f3f5;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* ダークモード */
                --bg-body: #121212;
                --bg-panel: #1e1e1e;
                --text-main: #e9ecef;
                --text-sub: #adb5bd;
                --primary: #3d8bfd;
                --primary-hover: #1a6fd8;
                --border-color: #343a40;
                --scan-line: #3d8bfd;
                --input-bg: #2b3035;
            }
        }

        /* --- グローバルスタイル --- */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
            margin: 0;
            min-height: 100vh;
        }

        /* --- レイアウトコンテナ --- */
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            height: 100vh;
        }

        /* PC画面では左右分割 */
        @media (min-width: 768px) {
            .main-layout {
                flex-direction: row;
                align-items: flex-start;
                padding: 40px;
            }
            
            .scanner-section {
                flex: 1;
                width: 100%;
            }

            .result-section {
                width: 400px;
                position: sticky;
                top: 40px;
            }
        }

        /* --- パネル共通スタイル --- */
        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- ヘッダー & タブ --- */
        .header-bar {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title {
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tabs {
            display: flex;
            padding: 10px 20px;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .tab-btn.active {
            background-color: var(--input-bg);
            color: var(--primary);
            font-weight: 700;
        }

        .tab-btn:hover:not(.active) {
            background-color: var(--bg-body);
        }

        /* --- スキャナーエリア --- */
        .scanner-viewport {
            position: relative;
            background-color: #000;
            width: 100%;
            min-height: 400px; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #reader {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* ▼▼▼ 二重表示の修正箇所 ▼▼▼ */
        /* ライブラリが自動生成する網掛けオーバーレイを強制非表示 */
        #qr-shaded-region {
            display: none !important;
        }

        /* カメラ映像をコンテナいっぱいに広げる設定 */
        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            border-radius: 0 !important;
        }
        /* ▲▲▲ 修正ここまで ▲▲▲ */

        /* カスタムスキャンオーバーレイ枠 */
        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            pointer-events: none;
            display: none;
            z-index: 10;
        }
        .scan-overlay.active { display: block; }

        .scan-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: var(--scan-line);
            border-style: solid;
            border-width: 4px;
        }
        .top-left { top: 0; left: 0; border-right: none; border-bottom: none; border-top-left-radius: 16px; }
        .top-right { top: 0; right: 0; border-left: none; border-bottom: none; border-top-right-radius: 16px; }
        .bottom-left { bottom: 0; left: 0; border-right: none; border-top: none; border-bottom-left-radius: 16px; }
        .bottom-right { bottom: 0; right: 0; border-left: none; border-top: none; border-bottom-right-radius: 16px; }

        .scan-laser {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--scan-line);
            top: 0;
            box-shadow: 0 0 4px var(--scan-line);
            animation: scan 2s infinite linear;
            opacity: 0.6;
        }
        @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }

        /* --- ファイルアップロードエリア --- */
        .file-upload-area {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 400px;
            background-color: var(--input-bg);
            border: 3px dashed var(--border-color);
            position: relative;
        }
        .file-upload-area.active { display: flex; }

        .upload-content {
            text-align: center;
            padding: 20px;
        }

        .upload-icon {
            font-size: 4rem;
            color: var(--text-sub);
            margin-bottom: 15px;
            display: block;
        }

        .custom-file-upload {
            display: inline-block;
            padding: 12px 24px;
            cursor: pointer;
            background-color: var(--primary);
            color: white;
            border-radius: 8px;
            font-weight: 500;
            margin-top: 15px;
            transition: background 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .custom-file-upload:hover { background-color: var(--primary-hover); }

        #qr-input-file { display: none; }

        /* --- 指定されたローディングスピナー --- */
        .loader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: none; /* デフォルト非表示 */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        
        @media (prefers-color-scheme: dark) {
            .loader-overlay {
                background-color: rgba(30, 30, 30, 0.9);
            }
        }

        .loader-overlay.active { display: flex; }

        /* ユーザー提供のSVGスタイル */
        .loader {
            width: 80px;
            height: 80px;
            animation: rotate 1s linear infinite;
            transform-origin: center center;
        }

        .loader .path {
            stroke: #007bff; /* ライトモード */
            stroke-linecap: round;
            stroke-dasharray: 89 150;
            stroke-dashoffset: 0;
            stroke-width: 1.5; /* 指定通り細く */
        }

        @media (prefers-color-scheme: dark) {
            .loader .path {
                stroke: #1a73e8; /* ダークモード */
            }
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        .loading-msg {
            margin-top: 20px;
            font-weight: 500;
            color: var(--text-sub);
        }

        /* --- 右側の結果パネル --- */
        .result-panel-content {
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
            justify-content: flex-start;
        }

        .empty-state {
            text-align: center;
            color: var(--text-sub);
            margin-top: 50px;
            display: block;
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 10px;
            display: block;
            opacity: 0.5;
        }

        .result-content {
            display: none; /* 結果が出るまで非表示 */
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.3s ease;
        }
        .result-content.show { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .scanned-value-box {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .action-btn-group {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .btn {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1rem;
            transition: opacity 0.2s;
            width: 100%;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:hover:not(:disabled) { opacity: 0.9; }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-secondary { background-color: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-color); }

        /* HTML5-QRCodeの不要な要素を隠す */
        #reader__dashboard_section_csr button { display: none; }
        #reader__dashboard_section_swaplink { display: none; }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <!-- 左側：スキャナーセクション -->
        <section class="scanner-section panel">
            <div class="header-bar">
                <div class="app-title">
                    <i class="bi bi-qr-code-scan" style="color: var(--primary);"></i>
                    <span>QR Scanner</span>
                </div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" id="tab-camera" onclick="switchMode('camera')">
                    <i class="bi bi-camera-fill"></i> カメラ
                </button>
                <button class="tab-btn" id="tab-file" onclick="switchMode('file')">
                    <i class="bi bi-image-fill"></i> 画像アップロード
                </button>
            </div>

            <div class="scanner-viewport">
                <!-- カメラ映像 -->
                <div id="reader"></div>
                
                <!-- カメラ用フレーム -->
                <div class="scan-overlay" id="scan-overlay">
                    <div class="scan-corner top-left"></div>
                    <div class="scan-corner top-right"></div>
                    <div class="scan-corner bottom-left"></div>
                    <div class="scan-corner bottom-right"></div>
                    <div class="scan-laser"></div>
                </div>

                <!-- ファイルアップロードUI -->
                <div class="file-upload-area" id="file-upload-area">
                    <div class="upload-content">
                        <i class="bi bi-cloud-arrow-up upload-icon"></i>
                        <h3 style="font-size: 1.1rem; margin-bottom: 5px;">画像をドラッグ&ドロップ</h3>
                        <p style="color: var(--text-sub); font-size: 0.9rem;">または</p>
                        <label for="qr-input-file" class="custom-file-upload">
                            ファイルを選択
                        </label>
                        <input type="file" id="qr-input-file" accept="image/*">
                        <p style="margin-top: 20px; font-size: 0.8rem; color: var(--text-sub);">
                            ※ スクリーンショットも読み取れます
                        </p>
                    </div>
                </div>

                <!-- 指定のローディングスピナー -->
                <div class="loader-overlay" id="loading-overlay">
                    <svg id="spinner" class="loader" viewBox="0 0 50 50">
                        <circle class="path" cx="25" cy="25" r="20" fill="none"></circle>
                    </svg>
                    <div class="loading-msg">QRコードを解析中...</div>
                </div>
            </div>
        </section>

        <!-- 右側：結果表示セクション -->
        <section class="result-section panel">
            <div class="header-bar">
                <div class="app-title" style="font-size: 1rem;">
                    <i class="bi bi-card-text"></i> スキャン結果
                </div>
            </div>
            
            <div class="result-panel-content">
                <!-- 未スキャン時の表示 -->
                <div id="empty-state" class="empty-state">
                    <i class="bi bi-qr-code"></i>
                    <p>カメラでスキャンするか<br>画像をアップロードしてください</p>
                </div>

                <!-- 結果表示 -->
                <div id="result-content" class="result-content">
                    <div>
                        <span style="font-size: 0.85rem; color: var(--text-sub); font-weight: 500;">読み取り内容</span>
                        <div class="scanned-value-box" id="result-text"></div>
                    </div>
                    
                    <div class="action-btn-group">
                        <button class="btn btn-primary" id="open-link-btn" onclick="openLink()" disabled>
                            <i class="bi bi-box-arrow-up-right"></i> URLを開く
                        </button>
                        <button class="btn btn-secondary" onclick="copyToClipboard()">
                            <i class="bi bi-clipboard"></i> コピー
                        </button>
                    </div>

                    <!-- エラー時のヒント（JSで表示制御） -->
                    <div id="error-hint" style="display:none; margin-top:10px; padding:10px; background:#fff3cd; color:#856404; border-radius:8px; font-size:0.85rem;">
                        <i class="bi bi-exclamation-triangle"></i> 読み取れませんか？ 画像をトリミング（QRコード部分だけを切り抜き）してから再度試してください。
                    </div>
                </div>
            </div>
        </section>

    </div>

    <script>
        // --- 変数定義 ---
        const html5QrCode = new Html5Qrcode("reader");
        const fileInput = document.getElementById('qr-input-file');
        const emptyState = document.getElementById('empty-state');
        const resultContent = document.getElementById('result-content');
        const resultText = document.getElementById('result-text');
        const scanOverlay = document.getElementById('scan-overlay');
        const loadingOverlay = document.getElementById('loading-overlay');
        const openLinkBtn = document.getElementById('open-link-btn');
        const errorHint = document.getElementById('error-hint');
        
        let currentMode = 'camera';
        let isScanning = false;

        // --- モード切替 ---
        function switchMode(mode) {
            currentMode = mode;
            
            // タブの見た目更新
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${mode}`).classList.add('active');

            const readerDiv = document.getElementById('reader');
            const fileArea = document.getElementById('file-upload-area');

            if (mode === 'camera') {
                fileArea.classList.remove('active');
                readerDiv.style.display = 'block';
                startCamera();
            } else {
                stopCamera().then(() => {
                    readerDiv.style.display = 'none';
                    scanOverlay.classList.remove('active');
                    fileArea.classList.add('active');
                });
            }
        }

        // --- カメラ機能 ---
        function startCamera() {
            if (isScanning) return;
            errorHint.style.display = 'none';

            // 設定: QRコードの検出範囲などを最適化
            const config = { 
                fps: 10, 
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            };
            
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
            .then(() => {
                isScanning = true;
                scanOverlay.classList.add('active');
            })
            .catch(err => {
                console.error("Camera Error", err);
                alert("カメラを起動できませんでした。HTTPS接続か確認してください。");
            });
        }

        function stopCamera() {
            if (isScanning) {
                return html5QrCode.stop().then(() => {
                    isScanning = false;
                    scanOverlay.classList.remove('active');
                    const video = document.querySelector('#reader video');
                    if(video) video.remove();
                }).catch(err => console.error(err));
            }
            return Promise.resolve();
        }

        // --- 画像ファイル処理 ---
        // ドラッグ&ドロップ対応
        const dropArea = document.getElementById('file-upload-area');
        dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.style.backgroundColor = 'var(--bg-body)'; });
        dropArea.addEventListener('dragleave', (e) => { e.preventDefault(); dropArea.style.backgroundColor = 'var(--input-bg)'; });
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.style.backgroundColor = 'var(--input-bg)';
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', e => {
            if (e.target.files.length === 0) return;
            handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            loadingOverlay.classList.add('active'); // スピナー表示
            errorHint.style.display = 'none';

            // UI描画更新のために少し待機
            setTimeout(() => {
                html5QrCode.scanFile(file, true)
                    .then(decodedText => {
                        loadingOverlay.classList.remove('active');
                        onScanSuccess(decodedText);
                    })
                    .catch(err => {
                        loadingOverlay.classList.remove('active');
                        console.error("File Scan Error", err);
                        
                        // 画像が読み取れなかった場合の処理
                        alert("QRコードを検出できませんでした。\n画像の解像度が低すぎるか、QRコードが小さすぎる可能性があります。画像をトリミングしてから再度お試しください。");
                        errorHint.style.display = 'block';
                        
                        // 入力をクリアして再選択可能にする
                        fileInput.value = '';
                    });
            }, 100); 
        }

        // --- 共通成功コールバック ---
        function onScanSuccess(decodedText, decodedResult) {
            if (currentMode === 'camera') {
                stopCamera();
            }

            // 右側のパネルに結果を表示
            emptyState.style.display = 'none';
            resultContent.classList.add('show');
            resultText.innerText = decodedText;

            // URL判定
            if (isValidURL(decodedText)) {
                openLinkBtn.disabled = false;
                openLinkBtn.innerHTML = '<i class="bi bi-box-arrow-up-right"></i> URLを開く';
            } else {
                openLinkBtn.disabled = true;
                openLinkBtn.innerHTML = '<i class="bi bi-text-left"></i> URLではありません';
            }
        }

        function onScanFailure(error) {
            // コンソールログを汚さないため何もしない
        }

        // --- ユーティリティ ---
        function copyToClipboard() {
            const text = resultText.innerText;
            if(!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.btn-secondary');
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="bi bi-check-lg"></i> コピーしました';
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                }, 2000);
            });
        }

        function openLink() {
            const text = resultText.innerText;
            if (isValidURL(text)) {
                window.open(text, '_blank');
            }
        }

        function isValidURL(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }

        // 初期化
        window.onload = () => {
            switchMode('camera');
        };
    </script>
</body>
</html>
